name: Publish Debian package

# Push to main  -> "dev" APT channel
# Tag v1.2.3    -> "stable" APT channel
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

jobs:

  build:
    name: "Build debian package"
    # Must match the Ubuntu release on the robots (shared library versions)
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the Docker configuration is in sync with the package defaults
        run: python3 scripts/sync-configs.py --check

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake curl libcurl4-openssl-dev iputils-ping libboost-filesystem-dev libboost-system-dev libboost-thread-dev
          sudo mkdir -p /usr/lib/ilvo
          sudo cp dependencies/x86_64/shared/libsnap7.so /usr/lib/ilvo/libsnap7.so

      - name: Build source code
        run: |
          mkdir build
          cd build
          NO_ASAN=1 cmake -DCMAKE_BUILD_TYPE=Release -DINSTALL_FOLDER="${{ github.workspace }}/artof-core/usr/bin" .. && make -j4 install

      - name: Build debian package
        id: version
        run: |
          version=$(scripts/package-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          scripts/build-deb.sh artof-core "$version" "artof-core_${version}_amd64.deb"
          dpkg-deb --info artof-core_*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: artof-deb
          path: artof-core_*.deb

  publish:
    name: "Publish to APT repository"
    needs:
    - build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'staging' }}

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: artof-deb

      - name: Install tools
        run: |
          sudo apt-get install -y apt-utils
          aws --version

      - name: Import signing key
        run: echo "${{ secrets.APT_SIGNING_KEY }}" | gpg --batch --import

      - name: Publish package
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          suite=${{ startsWith(github.ref, 'refs/tags/') && 'stable' || 'dev' }}
          scripts/publish-apt.sh "$suite" artof-core_*.deb
          AWS_DEFAULT_REGION=us-east-1 AWS_REQUEST_CHECKSUM_CALCULATION=when_required \
            aws --endpoint-url "$MINIO_ENDPOINT" s3 cp bootstrap.sh s3://tv115-ilvo-robotics/bootstrap.sh
